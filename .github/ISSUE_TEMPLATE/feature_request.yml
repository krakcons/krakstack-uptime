name: Feature request
description: Suggest an improvement to Krakstack Uptime
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or limitation should this change address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior and any alternatives you considered.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Deployment impact
      description: Note any expected configuration, migration, Worker, D1, or email changes.
